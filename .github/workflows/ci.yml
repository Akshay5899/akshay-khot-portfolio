name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Run build
      run: npm run build
      env:
        MONGODB_URI: 'mongodb://127.0.0.1:27017/nexvora-tech-test'
        NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
